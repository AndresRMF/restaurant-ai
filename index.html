<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Order Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-content">
        <div class="carousel-container">
            <div class="carousel-track">
                <div class="carousel-item"><img src="images/burger.png" alt="Classic Burger"></div>
                <div class="carousel-item"><img src="images/doble_burger.png" alt="Doble Burger"></div>
                <div class="carousel-item"><img src="images/cheese_burger.png" alt="Cheese Burger"></div>
                <div class="carousel-item"><img src="images/fries.png" alt="Fries"></div>
                <div class="carousel-item"><img src="images/tostadas.png" alt="Tostadas"></div>
                <div class="carousel-item"><img src="images/soda.png" alt="Cola"></div>
                <div class="carousel-item"><img src="images/manzana.png" alt="Manzana Soda"></div>
            </div>
        </div>

        <div id="order-summary" class="order-summary-panel">
            <h3>Your Order</h3>
            <ul id="order-items-list">
                <li class="placeholder">Your cart is empty</li>
            </ul>
            <div class="order-total">
                <span>Total:</span>
                <span id="order-total-price">$0.00</span>
            </div>
            
            <div class="session-controls">
                <p id="status" class="status-disconnected">
                    <span class="status-indicator"></span>
                    Status: Disconnected
                </p>
                <div class="buttons">
                    <button id="startButton">Start Order</button>
                    <button id="stopButton" disabled>Stop Session</button>
                    <button id="pauseButton" disabled>Pause Audio</button>
                </div>
            </div>
            <button id="confirmOrderButton" class="confirm-button ai-controlled">Confirm Order</button>
        </div>
    </main>

    <div id="payment-view" class="payment-view hidden">
        <h2>Confirm Your Details</h2>
        <form id="payment-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="As it appears on your card">
            </div>
            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" name="address" placeholder="123 Burger Lane">
            </div>
            <div class="form-group">
                <label for="cardNumber">Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" placeholder="**** **** **** ****">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="expiryDate">Expiry Date</label>
                    <input type="text" id="expiryDate" name="expiryDate" placeholder="MM/YY">
                </div>
                <div class="form-group">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" name="cvv" placeholder="123">
                </div>
            </div>
            <button type="submit" class="confirm-button ai-controlled">Place Order</button>
        </form>
    </div>

    <div id="success-notification" class="notification hidden">
        <p>Order placed successfully!</p>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
